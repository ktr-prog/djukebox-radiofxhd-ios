name: Radiofx
options:
  bundleIdPrefix: com.tobit.fl
  deploymentTarget:
    iOS: "12.0"
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CLANG_ENABLE_OBJC_ARC: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    COMPRESS_PNG_FILES: NO
    STRIP_PNG_TEXT: NO
    GCC_WARN_INHIBIT_ALL_WARNINGS: YES
targets:
  Radiofx_iPad:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobit.fl.Radiofxhd
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    postBuildScripts:
      - name: Copy original resources
        script: |
          cp -R "${SRCROOT}/Resources/." "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
